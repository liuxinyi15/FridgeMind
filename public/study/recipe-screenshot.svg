<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <rect width="900" height="1200" fill="#f2eee4"/>
  <rect x="70" y="55" width="760" height="1090" rx="30" fill="#ffffff"/>
  <g fill="#173f32" font-family="Arial, Helvetica, sans-serif">
    <text x="125" y="145" font-size="48" font-weight="700">Creamy Spinach Pasta</text>
    <text x="125" y="205" font-size="25">Serves 2</text>
    <text x="125" y="245" font-size="25">Ready in 20 minutes</text>
    <text x="125" y="330" font-size="32" font-weight="700">Ingredients</text>
    <text x="125" y="385" font-size="27">180 g pasta</text>
    <text x="125" y="430" font-size="27">150 g spinach</text>
    <text x="125" y="475" font-size="27">120 ml cream</text>
    <text x="125" y="520" font-size="27">1 onion</text>
    <text x="125" y="565" font-size="27">2 cloves garlic</text>
    <text x="125" y="650" font-size="32" font-weight="700">Method</text>
    <text x="125" y="710" font-size="25">1. Cook the pasta until tender.</text>
    <text x="125" y="760" font-size="25">2. Fry the onion and garlic.</text>
    <text x="125" y="810" font-size="25">3. Add spinach and cream.</text>
    <text x="125" y="860" font-size="25">4. Combine with pasta and serve.</text>
  </g>
  <text x="125" y="1060" fill="#6b7f76" font-family="Arial, Helvetica, sans-serif" font-size="21">A favourite weeknight recipe</text>
</svg>
